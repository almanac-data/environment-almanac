notes: |
  Human-verified 2026-11-01: HTTP 200. Plain curl gets only the page title; the content is a JavaScript app read in headless Chromium. It says "EPA collects comprehensive CO2, NOx, SO2, and mercury emissions data, and makes it publicly available, along with compliance and allowance data, and individual power plant details", "Create custom queries, download bulk datasets and use the CAM API", "2025 emissions data is available! (As of February 2026)", and "97% 2026 Third Quarter Emission Files Received", with app version v2.0.168. The CAM API Portal (https://www.epa.gov/power-sector/cam-api-portal) has a "Request API Key" form and its FAQ gives "Default rate limits of 1,000 requests per hour". A keyless call to the bulk-files endpoint answered 403, consistent with the key requirement. Formats are assumed from the query and API tools and weren't tested.
  Licence checked 2026-11-01: EPA is a federal agency, so its data is a US Government work. EPA's disclaimers page (https://www.epa.gov/web-policies-and-procedures/epa-disclaimers) notes that some documents on EPA sites "may be protected under the U.S. and Foreign Copyright Laws" and that this is noted where it applies; nothing on CAMPD says so. No CAMPD-specific data licence was found. Environment-almanac should set reachability.headless for this entry.
