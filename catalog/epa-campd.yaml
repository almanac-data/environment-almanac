id: epa-campd
type: dataset
title: Clean Air Markets Program Data (CAMPD)
description: |
  EPA's power-plant emissions, compliance and allowance data from continuous emissions monitoring: hourly-to-annual CO2, NOx, SO2 and mercury emissions by unit and facility, with allowance holdings and program compliance, through custom queries, bulk files and the CAM API.
