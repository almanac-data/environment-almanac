id: epa-ejscreen
type: dataset
title: EPA EJScreen (Environmental Justice Screening and Mapping Tool)
description: |
  EPA's environmental justice screening and mapping tool and its downloadable data: environmental indicators (such as PM2.5, ozone, diesel particulate matter, traffic and hazardous-facility proximity, lead paint, Superfund proximity, wastewater discharge) combined with demographic indicators at the census block group level. EPA removed the tool and its data downloads from public access in February 2025.
