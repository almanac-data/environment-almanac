id: openaq
type: dataset
title: OpenAQ Air Quality Data Platform
description: |
  A nonprofit platform that gathers ground-level air-quality measurements (PM2.5, PM10, O3, NO2, SO2, CO, black carbon) from government monitoring networks and other providers worldwide, and serves them through one API and an open archive on AWS, with each measurement traced to its source.
