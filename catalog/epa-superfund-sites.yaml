notes: |
  Human-verified 2026-10-31: HTTP 200. The page offers searches for "sites proposed to, currently on, and deleted from Superfund's National Priorities List (NPL) as well as sites being addressed under the Superfund Alternative Approach (SAA)", by state (including territories such as American Samoa and Guam), with a map and advanced search for NPL and non-NPL sites. The underlying system name (SEMS), the 1980s start, and the csv export weren't checked. Environment-almanac's epa-envirofacts entry is EPA's cross-program gateway; this entry is the Superfund-specific source.
