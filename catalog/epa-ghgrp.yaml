notes: |
  Human-verified 2026-10-31: HTTP 200. The page reports "2023 Greenhouse Gas Reporting Program data is now available". It also notes a September 12, 2025 EPA proposal "to permanently remove program obligations for 46 source categories of the GHGRP". That proposal is a real risk to future coverage, so this entry is worth fingerprinting while the data is live, and a steward should watch for the rule's outcome. The 2010 start, the FLIGHT tool, and API access through Envirofacts come from the program's usual description and weren't checked here.
