id: wri-global-nature-watch
type: dataset
title: Global Nature Watch (formerly Global Forest Watch)
description: |
  World Resources Institute's forest and land monitoring platform: annual 30 m tree cover loss, near-real-time deforestation alerts, tree cover and other land datasets with country and subnational dashboards, served through maps, a data portal and a data API. Formerly named Global Forest Watch.
