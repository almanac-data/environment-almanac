notes: |
  Human-verified 2026-11-01: HTTP 200 (page "Last updated on February 17, 2026"). It reads "Welcome to the SDWIS Fed Reporting Services system. This system offers the capability to query the Safe Drinking Water Information System (SDWIS) Fed Data Warehouse via report filters and various reporting options" and lists what states report: basic water-system information, violation information, and enforcement information. It links the reports application at https://sdwis.epa.gov/ords/sfdw_pub/f?p=SDWIS_FED_REPORTS_PUBLIC, which redirects (200) to https://sdwis.epa.gov/ords/sfdw_pub/r/sfdw/sdwis_fed_reports_public/200; that app renders in headless Chromium with a Water System Search and reports for Water System Summary and Detail, Service Area, Geographic Area, Site Visits, Event and Milestones, Facilities, Violations, Lead and Copper Report and Service Line Inventory, plus Tribal PFAS Monitoring Results and an AWIA Certification Report. The canonical URL is EPA's landing page rather than the app, whose path looks less stable. Not checked: export formats from the reports, any bulk download or API (SDWIS data are also served through Envirofacts and ECHO, already cataloged as epa-envirofacts and epa-echo), the start year, and the quarterly cadence (assumed from states' quarterly reporting).
  Licence checked 2026-11-01: EPA is a federal agency, so SDWIS data is a US Government work; no SDWIS-specific licence or copyright notice was found on either page. The data is reported by state primacy agencies, which EPA compiles and publishes.
