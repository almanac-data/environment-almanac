id: epa-sdwis
type: dataset
title: Safe Drinking Water Information System (SDWIS) Federal Reporting Services
description: |
  EPA's federal database of the nation's public water systems as reported by states, tribes and territories under the Safe Drinking Water Act: system inventory, violations of monitoring, treatment and contaminant-level rules, enforcement actions, lead and copper results and service-line inventories, queried through the SDWIS Fed reports system.
