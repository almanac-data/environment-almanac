notes: |
  Human-verified 2026-10-31 in headless Chromium: HTTP 200. The Datahub says the EEA collects and quality-checks data "through our network and other institutional partners across 38 European countries" and "This datahub allows you to explore and download these data"; a featured item was the European Ground Motion Service (7 Oct 2026). The EEA legal notice (https://www.eea.europa.eu/en/legal-notice) says "EEA materials are published under the CC-BY license" and may be re-used "for commercial or non-commercial purposes, provided that the EEA is always acknowledged". The CC BY version (4.0) and the formats come from the EEA's usual practice and weren't checked here.
